name: SM86 R5 inplace SASS diff

on:
  push:
    branches:
      - opt/sm86-rtx3070-r5-inplace
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare final SASS
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -cubin -arch=sm_86
            -DRECOVERY_LAUNCH_MAX_THREADS=128
            -DRECOVERY_LAUNCH_MIN_BLOCKS=3
            -DRECOVERY_NOINLINE_SHA512_WORDS=0
            -DRECOVERY_NOINLINE_FIXED64_HMAC=0
            -DRECOVERY_NOINLINE_PBKDF2=0
            -DRECOVERY_PBKDF2_SCALAR_UT=0
            -DRECOVERY_PBKDF2_T_SHARED=0
            -DRECOVERY_PBKDF2_STATE_SHARED=0
            -DRECOVERY_SHA512_HALF_SHARED_SCHEDULE=0
          )
          nvcc "${common[@]}" -DRECOVERY_FIXED64_INPLACE=0 src/gpu/cuda/kernel.cu -o /tmp/ref.cubin
          nvcc "${common[@]}" -DRECOVERY_FIXED64_INPLACE=1 src/gpu/cuda/kernel.cu -o /tmp/inplace.cubin

          cuobjdump --dump-sass /tmp/ref.cubin > /tmp/ref.sass
          cuobjdump --dump-sass /tmp/inplace.cubin > /tmp/inplace.sass

          echo "=== cubin sizes ==="
          stat -c '%n %s' /tmp/ref.cubin /tmp/inplace.cubin
          echo "=== SASS sizes / hashes ==="
          wc -l -c /tmp/ref.sass /tmp/inplace.sass
          sha256sum /tmp/ref.sass /tmp/inplace.sass
          echo "=== diff summary ==="
          if cmp -s /tmp/ref.sass /tmp/inplace.sass; then
            echo "SASS_IDENTICAL=1"
          else
            echo "SASS_IDENTICAL=0"
            diff -u /tmp/ref.sass /tmp/inplace.sass | head -240 || true
          fi
