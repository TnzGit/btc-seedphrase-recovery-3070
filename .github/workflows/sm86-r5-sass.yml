name: SM86 R5 SASS census

on:
  push:
    branches:
      - opt/sm86-rtx3070-r5-inplace
  workflow_dispatch:

jobs:
  sass:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a256
            max_threads: 256
            min_blocks: 2
          - name: g128
            max_threads: 128
            min_blocks: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile and inspect SASS
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.name }} ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MAX_THREADS=${{ matrix.max_threads }} \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=${{ matrix.min_blocks }} \
            -DRECOVERY_NOINLINE_SHA512_WORDS=0 \
            -DRECOVERY_NOINLINE_FIXED64_HMAC=0 \
            -DRECOVERY_NOINLINE_PBKDF2=0 \
            -DRECOVERY_PBKDF2_SCALAR_UT=0 \
            -DRECOVERY_PBKDF2_T_SHARED=0 \
            -DRECOVERY_PBKDF2_STATE_SHARED=0 \
            -DRECOVERY_SHA512_HALF_SHARED_SCHEDULE=0 \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu -o /tmp/k.cubin 2>&1 | tee /tmp/ptxas.txt

          cuobjdump --dump-sass /tmp/k.cubin > /tmp/sass.txt
          echo "=== cuobjdump function headers ==="
          grep -n 'Function' /tmp/sass.txt | head -40 || true
          start=$(grep -n 'pbkdf2_hmac_sha512_block' /tmp/sass.txt | head -1 | cut -d: -f1 || true)
          if [ -n "$start" ]; then
            next=$(tail -n +$((start+1)) /tmp/sass.txt | grep -n 'Function' | head -1 | cut -d: -f1 || true)
            if [ -n "$next" ]; then
              sed -n "${start},$((start+next-1))p" /tmp/sass.txt > /tmp/pbkdf2.sass
            else
              tail -n +"$start" /tmp/sass.txt > /tmp/pbkdf2.sass
            fi
          else
            : > /tmp/pbkdf2.sass
          fi

          echo "=== PBKDF2 SASS line count ==="
          wc -l /tmp/pbkdf2.sass
          echo "=== PBKDF2 opcode census (top 40) ==="
          grep -oE '/\*[^*]+\*/[[:space:]]+[A-Z0-9_.]+' /tmp/pbkdf2.sass |
            sed -E 's@.*/\*[^*]+\*/[[:space:]]+@@' |
            sort | uniq -c | sort -nr | head -40 || true
          echo "=== local-memory instructions ==="
          grep -E 'LDL|STL|LDS|STS' /tmp/pbkdf2.sass | wc -l || true
          echo "=== shift/funnel instructions ==="
          grep -E 'SHF|SHR|SHL' /tmp/pbkdf2.sass | wc -l || true
          echo "=== integer add/logic sample ==="
          grep -E 'IADD|IADD3|LOP3|SHF' /tmp/pbkdf2.sass | head -80 || true
