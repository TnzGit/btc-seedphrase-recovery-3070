name: SM86 R3 lab static screen

on:
  push:
    branches:
      - opt/sm86-rtx3070-r3-lab
  workflow_dispatch:

concurrency:
  group: sm86-r3-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  scalar-ut-ptxas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        scalar_ut: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM86 scalar-U/T experiment
        run: |
          echo "=== scalar_ut=${{ matrix.scalar_ut }} ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=2 \
            -DRECOVERY_PBKDF2_SCALAR_UT=${{ matrix.scalar_ut }} \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu \
            -o /tmp/kernel-scalar-ut-${{ matrix.scalar_ut }}.cubin


  shared-t-ptxas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        t_shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM86 shared-T experiment
        run: |
          echo "=== t_shared=${{ matrix.t_shared }} ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=2 \
            -DRECOVERY_PBKDF2_T_SHARED=${{ matrix.t_shared }} \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu \
            -o /tmp/kernel-t-shared-${{ matrix.t_shared }}.cubin


  shared-state-ptxas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        state_shared: [0, 1]
        t_shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM86 shared-state/T matrix
        run: |
          echo "=== state_shared=${{ matrix.state_shared }} t_shared=${{ matrix.t_shared }} ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=2 \
            -DRECOVERY_PBKDF2_STATE_SHARED=${{ matrix.state_shared }} \
            -DRECOVERY_PBKDF2_T_SHARED=${{ matrix.t_shared }} \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu \
            -o /tmp/kernel-state-${{ matrix.state_shared }}-t-${{ matrix.t_shared }}.cubin


  half-shared-schedule-ptxas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        half_shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM86 half-shared SHA512 schedule
        run: |
          echo "=== half_shared_schedule=${{ matrix.half_shared }} ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=2 \
            -DRECOVERY_SHA512_HALF_SHARED_SCHEDULE=${{ matrix.half_shared }} \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu \
            -o /tmp/kernel-half-shared-${{ matrix.half_shared }}.cubin


  launch-geometry-ptxas:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - max_threads: 256
            min_blocks: 2
          - max_threads: 128
            min_blocks: 3
          - max_threads: 64
            min_blocks: 6
          - max_threads: 96
            min_blocks: 4
          - max_threads: 96
            min_blocks: 5
          - max_threads: 160
            min_blocks: 2
          - max_threads: 160
            min_blocks: 3
          - max_threads: 192
            min_blocks: 2
          - max_threads: 224
            min_blocks: 2
    steps:
      - uses: actions/checkout@v4
      - name: Compile SM86 launch geometry
        run: |
          echo "=== launch_bounds(${{ matrix.max_threads }}, ${{ matrix.min_blocks }}) ==="
          nvcc -cubin -arch=sm_86 \
            -DRECOVERY_LAUNCH_MAX_THREADS=${{ matrix.max_threads }} \
            -DRECOVERY_LAUNCH_MIN_BLOCKS=${{ matrix.min_blocks }} \
            -Xptxas=-v \
            src/gpu/cuda/kernel.cu \
            -o /tmp/kernel-lb-${{ matrix.max_threads }}-${{ matrix.min_blocks }}.cubin
